<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · BreachLab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page login-page">
    <p class="eyebrow">BreachLab · Version 0.1</p>
    <h1>Lab login</h1>
    <p class="intro">This is a demonstration interface. Submitting the form does not authenticate a user.</p>
    {% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}
    <form method="post">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button" type="submit">Continue</button>
    </form>
    <a class="back-link" href="{{ url_for('home') }}">Back to home</a>
  </main>
</body>
</html>
